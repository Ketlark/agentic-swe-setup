pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,js,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.ts"
      run: pnpm typecheck

pre-push:
  commands:
    test:
      run: pnpm test

commit-msg:
  commands:
    conventional:
      run: pnpm exec commitlint --edit {1}
